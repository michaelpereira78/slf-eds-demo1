<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AEM Sidekick Library: blocks, approved templates and approved content" />
    <meta name="robots" content="noindex" />
    <base href="/" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background-color: #ededed;
        height: 100%;
      }

      helix-sidekick { display: none; }

      :root {
        --sk-block-table-background-color: #f9a66c;
        --sk-block-table-foreground-color: #1e4d3b;
        --sk-section-metadata-table-background-color: #f9a66c;
        --sk-section-metadata-table-foreground-color: #1e4d3b;
        --sk-metadata-table-background-color: #f9a66c;
        --sk-metadata-table-foreground-color: #1e4d3b;
      }
    </style>
    <title>Advisor Demo Library</title>
  </head>
  <body>
    <script type="module" src="https://tools.aem.live/tools/sidekick/library/index.js"></script>
    <script>
      const library = document.createElement('sidekick-library');
      library.config = {
        base: '/tools/sidekick/library.json',
        plugins: {
          blocks: { encodeImages: false },
          'approved-content': {
            src: '/tools/sidekick/plugins/approved-content/approved-content.js',
            title: 'Approved content',
          },
        },
      };
      document.body.prepend(library);
    </script>
  </body>
</html>
